name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */5 * * *'  # Every 5 hours — two-failure buffer before 12h sleep threshold
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Ping Streamlit app
        run: |
          python3 - << 'EOF'
          import asyncio
          import sys
          from playwright.async_api import async_playwright, TimeoutError as PWTimeout

          URL     = "https://halfcell.streamlit.app"
          TIMEOUT = 120_000

          async def main():
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch()
                  page    = await browser.new_page()

                  # Navigate — if this succeeds, the visit is registered and the
                  # inactivity timer is reset regardless of JS render state.
                  try:
                      print(f"Navigating to {URL} ...")
                      await page.goto(URL, wait_until="domcontentloaded", timeout=TIMEOUT)
                  except PWTimeout:
                      print("ERROR: Page failed to load within timeout.", file=sys.stderr)
                      await browser.close()
                      sys.exit(1)

                  title = await page.title()
                  print(f"Page title: {title}")

                  # A blank or error title means something went wrong server-side.
                  if not title or "error" in title.lower():
                      print("ERROR: Unexpected page title — app may be in a bad state.", file=sys.stderr)
                      await browser.close()
                      sys.exit(1)

                  # If the app is sleeping, Streamlit shows a wake prompt — click it.
                  for wake_text in ["Yes, get this app back up!", "Wake app"]:
                      try:
                          btn = await page.wait_for_selector(f"text={wake_text}", timeout=5_000)
                          print(f"App was sleeping — clicking '{wake_text}' ...")
                          await btn.click()
                          break
                      except PWTimeout:
                          pass

                  print("SUCCESS: App was reached and inactivity timer reset.")
                  await browser.close()

          asyncio.run(main())
          EOF
