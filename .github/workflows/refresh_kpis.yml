name: Refresh Market KPI Snapshot

# Scheduled runs are disabled. This job reads the committed processed parquets,
# which only change when the data pipeline is re-run locally — so on a schedule it
# recomputed identical KPIs and committed a bare `computed_at` bump every day
# (~100 no-op commits between May and August 2026).
#
# KPI computation now belongs in the data-refresh pipeline, alongside
# prepare_data.py and precompute_cache.py, so it runs when the data actually
# changes. Kept here as manual-dispatch only until that pipeline exists.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Compute KPIs
        run: python scripts/compute_kpis.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/latest_kpis.json
          if git diff --cached --quiet; then
            echo "No changes to KPI snapshot — skipping commit."
          else
            git commit -m "chore: refresh market KPI snapshot [skip ci]"
            git push
          fi
