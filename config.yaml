# Halfcell configuration: data collection and logging only.
#
# Every key here is read by the code. The model's settings live elsewhere: the
# published backtest configuration in scripts/precompute_cache.py, and NESO's
# rules in src/analysis/neso_rules.py. API base URLs are constants in each
# collector under src/data_collection/.

data_collection:
  start_date: "2019-01-01"
  end_date: null   # null => collect through today; override with --end

apis:
  national_grid_eso:
    # NESO Data Portal (CKAN, no key required)
    demand_data_dataset_id: "8f2fe0af-871c-488d-8bad-960426f24601"
    rate_limit: 2  # datastore limit: 2 requests per minute

  elexon:
    # Elexon Insights Solution API (no key required)
    rate_limit: 60  # requests per minute

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR; the LOG_LEVEL environment variable overrides it
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  file: "bess_analysis.log"  # under logs/
