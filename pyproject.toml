# Halfcell as an installable package, so `src` and `scripts` import from anywhere
# without each entry point editing sys.path:
#     pip install -e . -c constraints.txt
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halfcell"
version = "0.1.0"
description = "Day-ahead frequency response and wholesale arbitrage backtest for a GB battery"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["site/node_modules", "site/dist"]

[tool.ruff.lint]
# Pyflakes and pycodestyle's errors, named rather than left to ruff's defaults, which
# widened in 0.16. Naming a one-line lambda is how this codebase writes small local
# helpers, so E731 is off.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]
